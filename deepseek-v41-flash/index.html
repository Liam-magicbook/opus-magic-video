<body><div id="stage">

<script src="./node_modules/d3/dist/d3.min.js"></script>
<script type="module">
const cues=await fetch('./cues.json',{cache:'no-store'}).then(r=>r.json());
const EV=cues.ev;
window.DEMO={width:1920,height:1080,fps:30,duration:60,motionBlur:{samples:2,shutter:0.5}};
/* ---------------- helpers ---------------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x, lerp=(a,b,u)=>a+(b-a)*u, P=(t,a,d)=>clamp((t-a)/d);
const oC=u=>1-Math.pow(1-u,3), oQ=u=>1-Math.pow(1-u,4), oX=u=>u>=1?1:1-Math.pow(2,-10*u), iQ=u=>u*u,
  ioC=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2, ioS=u=>-(Math.cos(Math.PI*u)-1)/2,
  oB=(u,s=1.7)=>1+(s+1)*Math.pow(u-1,3)+s*Math.pow(u-1,2);
function bez(x1,y1,x2,y2){return u=>{if(u<=0)return 0;if(u>=1)return 1;let t=u;for(let i=0;i<8;i++){const cx=3*x1*t*(1-t)**2+3*x2*t*t*(1-t)+t**3-u;const d=3*x1*(1-t)**2+6*(x2-x1)*t*(1-t)+3*(1-x2)*t*t;if(Math.abs(d)<1e-6)break;t=clamp(t-cx/d);}return 3*y1*t*(1-t)**2+3*y2*t*t*(1-t)+t**3;};}
const eFly=bez(.62,0,.22,1), eMark=bez(.16,.94,.18,1);
const wob=(dt,f=5,k=11)=>dt<0?0:Math.exp(-k*dt)*Math.cos(2*Math.PI*f*dt);
const mixc=(a,b,u)=>{const A=a.match(/\w\w/g).map(h=>parseInt(h,16)),B=b.match(/\w\w/g).map(h=>parseInt(h,16));return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],u))).join(',')})`;};
const INK='25313D',MID='8C9AA8',OR='FF5A36',CARD='F7F9FB';
const world=document.getElementById('world'), hud=document.getElementById('hud'), endL=document.getElementById('end');
const el=(tag,cls,parent,css,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||world).appendChild(e);return e;};
const SVGNS='http://www.w3.org/2000/svg';
const sv=(tag,attrs,parent)=>{const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;};
const U=[];
const shadow=(lift,a=.26)=>`drop-shadow(0 ${(6+30*lift).toFixed(1)}px ${(10+30*lift).toFixed(1)}px rgba(22,34,46,${(a-0.08*lift).toFixed(3)}))`;
function slap(t,land,dur=.2,amp=.3){const p=(t-(land-dur))/dur;if(p<0)return{o:0,s:1+amp,r:6,lift:1};
  if(p<1){const L=1-iQ(p);return{o:clamp(p*5),s:1+amp*L,r:6*L,lift:L};}
  const w=wob(t-land,4.5,10);return{o:1,s:1-.035*w,r:-.8*w,lift:0};}
/* ---------------- camera ---------------- */
const CAM=cues.cam;
const seg=[];
for(let i=1;i<CAM.length;i++){const a=CAM[i-1],b=CAM[i];
  seg.push({a,b,I:b.move==='fly'?d3.interpolateZoom.rho(.82)([a.x??960,a.y,1920/a.z],[b.x??960,b.y,1920/b.z]):null});}
function cam(t){
  if(t<=CAM[0].t)return{x:CAM[0].x??960,y:CAM[0].y,z:CAM[0].z};
  for(const s of seg){if(t<=s.b.t){const u=(t-s.a.t)/(s.b.t-s.a.t);
    if(s.I){const v=s.I(eFly(u));return{x:v[0],y:v[1],z:1920/v[2]};}
    const e=ioS(u),ax=s.a.x??960,bx=s.b.x??960;
    return{x:lerp(ax,bx,e),y:lerp(s.a.y,s.b.y,e),z:Math.exp(lerp(Math.log(s.a.z),Math.log(s.b.z),e))};}}
  const l=CAM[CAM.length-1];return{x:l.x??960,y:l.y,z:l.z};}
/* ---------------- section kit ---------------- */
const SEC=[0,1080,2160,3240,4320];   // section tops in world space (1080 pitch; camera y = SEC+540)
function kicker(x,y,num,zh,en,at){const k=el('div','a zh',world,`left:${x}px;top:${y}px;font:700 25px/1 'Alibaba PuHuiTi';color:#25313D;white-space:nowrap;z-index:34`,
  `<span style="display:inline-block;width:17px;height:17px;background:#FF5A36;margin-right:13px;vertical-align:-1px"></span>${num} ${zh}<span style="font:600 17px 'JetBrains Mono';letter-spacing:.2em;color:#8C9AA8;margin-left:16px">${en}</span>`);
  U.push(t=>{const u=oC(P(t,at,.42));k.style.opacity=u;k.style.transform=`translateY(${(1-u)*18}px)`;});return k;}
function headline(x,y,lines,at,size,gap=1.18){const nodes=lines.map((ln,i)=>{
  const m=el('div','mask',world,`left:${x-16}px;top:${y+i*size*gap-12}px;width:1600px;height:${size*1.38}px;z-index:32`);
  const d=el('div','a zh',m,`left:16px;top:10px;font:900 ${size}px/1.14 'Alibaba PuHuiTi';color:#25313D;white-space:nowrap;letter-spacing:-.015em`,ln.t);
  return{d,m,delay:i*.13};});
  U.push(t=>nodes.forEach(n=>{const u=oX(P(t,at+n.delay,.6));n.d.style.transform=`translateY(${((1-u)*size*1.45).toFixed(1)}px)`;}));
  return nodes;}
function note(x,y,txt,at,w=1520){const n=el('div','a zh',world,`left:${x}px;top:${y}px;width:${w}px;font:500 23px/1.6 'Alibaba PuHuiTi';color:#5E6D7B;z-index:34`,txt);
  U.push(t=>{const u=oC(P(t,at,.5));n.style.opacity=u;n.style.transform=`translateY(${(1-u)*12}px)`;});return n;}
/* marker swipe inside a note: a second beat of motion while the section holds */
const HL='<i style="position:absolute;left:-7px;right:-7px;bottom:1px;height:15px;background:#FF5A36;opacity:.26;transform-origin:0 50%;transform:scaleX(0);z-index:0"></i>';
function noteHi(x,y,txt,hl,at,w=1520,delay=1.5){
  const n=el('div','a zh',world,`left:${x}px;top:${y}px;width:${w}px;font:500 23px/1.6 'Alibaba PuHuiTi';color:#5E6D7B;z-index:34`,
    txt.replace(hl,`<span style="position:relative;display:inline-block;isolation:isolate;color:#25313D">${HL}<span style="position:relative;z-index:1">${hl}</span></span>`));
  const m=n.querySelector('i');
  U.push(t=>{const u=oC(P(t,at,.5));n.style.opacity=u;n.style.transform=`translateY(${(1-u)*12}px)`;
    const s=ioC(P(t,at+delay,.55));m.style.transform=`scaleX(${s})`;});return n;}
function hairline(x,y,w,at,thick=3,col='#25313D',z=32){const r=el('div','a',world,`left:${x}px;top:${y}px;width:${w}px;height:${thick}px;background:${col};transform-origin:0 50%;z-index:${z}`);
  U.push(t=>{r.style.transform=`scaleX(${oQ(P(t,at,.6))})`;});return r;}
const DARKCHIP='height:52px;padding:0 22px;border-radius:9px;background:#25313D;color:#F7F9FB;font:700 23px/52px \'Alibaba PuHuiTi\';white-space:nowrap;z-index:34;transform-origin:50% 50%';
const LINECHIP='height:50px;padding:0 20px;border-radius:8px;background:#F7F9FB;box-shadow:inset 0 0 0 2px #CFD9E1;color:#25313D;font:700 21px/50px \'Alibaba PuHuiTi\';white-space:nowrap;z-index:34;transform-origin:50% 50%';
function chip(x,y,txt,land,style=DARKCHIP){const b=el('div','a zh',world,`left:${x}px;top:${y}px;${style}`);b.textContent=txt;
  U.push(t=>{const s=slap(t,land,.16,.4);b.style.opacity=s.o;b.style.transform=`scale(${s.s}) rotate(${s.r*.5}deg)`;});return b;}

/* ---- chapter cards: full-width paper bands that the camera flies past between sections ---- */
const DIVS=[{y:1000,n:'01',zh:'结构',en:'ASYMMETRIC CED'},{y:2080,n:'02',zh:'缓存',en:'KV CACHE'},
            {y:3160,n:'03',zh:'跑分',en:'BENCHMARKS'},{y:4240,n:'04',zh:'成本',en:'PRICING'}];
DIVS.forEach(d=>{
  const band=el('div','a',world,`left:0;top:${d.y}px;width:1920px;height:224px;background:#E9EEF2;opacity:0;z-index:26`);
  const ln=el('div','a',band,'left:140px;top:0;width:1640px;height:2px;background:#25313D;opacity:.55');
  const nn=el('div','a in',band,`left:138px;top:38px;font:900 78px/1 'Inter';letter-spacing:-.04em;color:#25313D`,d.n);
  const zz=el('div','a zh',band,`left:${138+112}px;top:48px;font:900 40px/1 'Alibaba PuHuiTi';color:#25313D`,d.zh);
  const ee=el('div','a mo',band,`left:${138+116}px;top:96px;font:600 14px 'JetBrains Mono';letter-spacing:.24em;color:#8C9AA8`,d.en);
  const bl=el('div','a',band,'left:140px;top:150px;width:60px;height:4px;background:#FF5A36');
  U.push((tt,C)=>{
    const k=clamp((520-Math.abs(d.y+112-C.y))/210);
    band.style.opacity=(k>.01?1:0);
    band.style.transform=`translateY(${((1-k)*26).toFixed(1)}px)`;
    band.style.clipPath=k>=1?'none':`inset(0 0 ${((1-k)*100).toFixed(1)}% 0)`;
  });
});
/* ================= A · title ================= */
{
  const B=SEC[0];
  kicker(140,B+96,'00','硬核拆解','DEEPSEEK · NO.001',EV.kick);
  headline(140,B+148,[{t:'读得越多，'},{t:'为什么反而越便宜？'}],EV.title1,100,1.2);
  const mk=el('div','a',world,`left:${140+100*5}px;top:${B+148+100*1.2+108}px;width:${100*3}px;height:20px;background:#FF5A36;transform-origin:0 50%;z-index:33`);
  U.push(t=>{mk.style.transform=`scaleX(${ioC(P(t,EV.marker[0],EV.marker[1]-EV.marker[0]))})`;});
  const sub=el('div','a in',world,`left:140px;top:${B+148+100*1.2+144}px;font:600 25px 'Inter';letter-spacing:.16em;color:#8C9AA8;white-space:nowrap;z-index:33`,'WHY DOES READING MORE COST LESS?');
  U.push(t=>{const u=oC(P(t,EV.sub,.45));sub.style.opacity=u;sub.style.transform=`translateX(${(1-u)*-30}px)`;});
  hairline(140,B+148+100*1.2+204,540,EV.sub+.06);
  note(140,B+148+100*1.2+234,'552B 参数 MoE · 100 万 token 上下文 · 原生多模态',EV.sub+.14,720);
  ['1M 上下文','原生读图','MIT 开源'].forEach((c,i)=>chip(140+i*216,B+148+100*1.2+296,c,EV.chips[i]));
  const fn=el('div','a zh',world,`left:140px;top:${B+880}px;font:500 21px/1 'Alibaba PuHuiTi';color:#A6B4BF;white-space:nowrap;z-index:33`,'* 全文数字取自 DeepSeek 官方发布页与技术报告');
  U.push(t=>{fn.style.opacity=.92*oC(P(t,EV.note,.5));});
  // second beat: sharpen the question before the first turn
  {
    const qy=B+700;
    const l1=el('div','a zh',world,`left:140px;top:${qy}px;font:500 27px/1.6 'Alibaba PuHuiTi';color:#5E6D7B;white-space:nowrap;z-index:33`,'上下文越长，缓存越大、显存越贵——');
    const l2=el('div','a zh',world,`left:140px;top:${qy+46}px;font:900 40px/1.35 'Alibaba PuHuiTi';color:#25313D;white-space:nowrap;z-index:33`,'这一代，账是<span style="color:#FF5A36">反着算</span>的。');
    const ar=el('div','a',world,`left:${140+330}px;top:${qy+4}px;width:${560}px;height:2px;background:#25313D;transform-origin:0 50%;opacity:.35;z-index:32`);
    U.push(t=>{const u=oC(P(t,EV.q2,.55));l1.style.opacity=u*.95;l1.style.transform=`translateX(${(1-u)*-18}px)`;
      ar.style.transform=`scaleX(${oQ(P(t,EV.q2,.6))})`;
      const v=oX(P(t,EV.q2+.55,.55));l2.style.opacity=clamp(P(t,EV.q2+.5,.18));l2.style.transform=`translateY(${(1-v)*22}px)`;});
  }
  // sticker
  const st=el('div','a',world,`left:1210px;top:${B+110}px;width:580px;height:660px;z-index:35;transform-origin:50% 60%`);
  st.innerHTML=`<svg width="580" height="660" style="overflow:visible">
    <g stroke="#F7F9FB" stroke-width="15" stroke-linejoin="round" paint-order="stroke">
      <rect x="96" y="150" width="326" height="420" rx="12" fill="#D8E1E8" transform="rotate(8 259 360)"/>
      <rect x="108" y="128" width="326" height="420" rx="12" fill="#EAEFF3" transform="rotate(-4 271 338)"/>
      <rect x="120" y="106" width="326" height="420" rx="12" fill="#F7F9FB"/></g>
    <g fill="none" stroke="#B9C6D1" stroke-width="5" stroke-linecap="round">
      <path d="M152 194 H358 M152 222 H326 M152 250 H358 M152 278 H308 M152 306 H358 M152 334 H336 M152 362 H296"/>
      <path d="M152 418 H358 M152 446 H294 M152 474 H358 M152 502 H318"/></g>
    <rect x="120" y="106" width="326" height="54" rx="12" fill="#25313D"/>
    <text x="140" y="141" fill="#F7F9FB" font-family="JetBrains Mono" font-weight="700" font-size="18" letter-spacing="1.4">CONTEXT · 1,000,000</text>
    <rect x="120" y="264" width="326" height="6" fill="#FF5A36" opacity=".85"/>
    <g transform="translate(402 458) rotate(-9)">
      <rect x="-92" y="-42" width="184" height="84" rx="10" fill="#FF5A36"/>
      <text x="0" y="-4" text-anchor="middle" fill="#fff" font-family="Inter" font-weight="900" font-size="26" letter-spacing="1">1M TOKEN</text>
      <text x="0" y="26" text-anchor="middle" fill="#FFD8CE" font-family="JetBrains Mono" font-weight="700" font-size="15" letter-spacing="1.6">ONE PASS</text></g>
  </svg>`;
  U.push(t=>{const s=slap(t,EV.doc_land,.24,.34);st.style.opacity=s.o;
    const drop=t<EV.doc_land?250*(1-iQ(P(t,0,EV.doc_land))):0;
    st.style.transform=`translateY(${-drop}px) rotate(${-3+s.r}deg) scale(${s.s})`;
    st.style.filter=shadow(s.lift*.9);});
}
/* ================= B · asymmetric CED ================= */
{
  const B=SEC[1];
  kicker(140,B+96,'01','结构','ASYMMETRIC CED',EV.c1kick);
  headline(140,B+148,[{t:'输入和输出，'},{t:'不按同一套算。'}],EV.c1head,86,1.2);
  const specs=[['BACKBONE','552B MoE'],['LAYERS','20 E + 20 D'],['PRETRAIN','45T tokens']];
  specs.forEach((s,i)=>{const yy=B+124+i*48;
    const l=el('div','a mo',world,`left:1330px;top:${yy}px;font:600 15px 'JetBrains Mono';letter-spacing:.2em;color:#8C9AA8;white-space:nowrap;z-index:33`,s[0]);
    const v=el('div','a in',world,`left:1552px;top:${yy-9}px;font:800 27px 'Inter';color:#25313D;white-space:nowrap;z-index:33`,s[1]);
    U.push(t=>{const u=oC(P(t,EV.c1head+i*.07,.45));l.style.opacity=u;v.style.opacity=u;v.style.transform=`translateX(${(1-u)*16}px)`;});});
  const BY=B+400, BH=286, BW=452, BL=140, BR=752, cy=BY+BH/2;
  const dsvg=sv('svg',{width:1920,height:5900,style:'position:absolute;left:0;top:0;z-index:30;overflow:visible'},world);
  const gD=sv('g',{},dsvg);
  [[BL,0],[BR,1]].forEach(([bx,i])=>{
    const g=sv('g',{},gD);
    sv('rect',{x:bx,y:BY,width:BW,height:BH,rx:13,fill:'#F7F9FB',stroke:'#CFD9E1','stroke-width':3},g);

    sv('rect',{x:bx,y:BY+30,width:BW,height:14,fill:'#25313D'},g);

    sv('text',{x:bx+BW-20,y:BY+30,fill:'#8C9AA8','text-anchor':'end','font-family':'JetBrains Mono','font-weight':700,'font-size':14,'letter-spacing':1.6},g).textContent='20 层';
    for(let k=0;k<18;k++){const ly=BY+62+k*11.4;sv('rect',{x:bx+24,y:ly,width:BW-48,height:4.2,rx:2,fill:k%6===0?'#8C9AA8':'#D5DEE6'},g);}
    sv('text',{x:bx+20,y:BY+BH-15,fill:'#8C9AA8','font-family':'JetBrains Mono','font-weight':700,'font-size':13,'letter-spacing':1.8},g).textContent=i?'DECODE':'PREFILL';
    // each box is pasted on: rise + settle, so the section opens with two slaps
    U.push(t=>{const s=slap(t,EV.c1head+.18+i*.16,.22,.26);
      g.setAttribute('opacity',s.o);
      g.setAttribute('transform',`translate(0 ${((1-s.o)*70).toFixed(1)})`);
      g.style.transformOrigin=`${bx+BW/2}px ${BY+BH/2}px`;});});
  const lk=sv('path',{d:`M${BL+BW} ${cy-46} C${BL+BW+68} ${cy-46} ${BR-68} ${cy-46} ${BR} ${cy-46}`,fill:'none',stroke:'#FF5A36','stroke-width':6,'stroke-dasharray':'1 1',pathLength:1,'stroke-linecap':'round'},gD);
  const lklab=sv('text',{x:BL+BW+16,y:cy-58,fill:'#FF5A36','font-family':'Alibaba PuHuiTi','font-weight':700,'font-size':19},gD);
  lklab.textContent='全局 KV';
  sv('path',{d:`M${BL+BW+10} ${cy+40} H${BR-14}`,fill:'none',stroke:'#25313D','stroke-width':3.5,'stroke-dasharray':'13 11'},gD);
  sv('path',{d:`M${BR} ${cy+40} l-18 -12 l0 24 Z`,fill:'#25313D'},gD);
  const tlab=sv('text',{x:BL+BW+14,y:cy+78,fill:'#8C9AA8','font-family':'JetBrains Mono','font-weight':700,'font-size':13,'letter-spacing':1.6},gD);
  tlab.textContent='TOKEN →';
  const tin=[],tout=[];
  const gTok=sv('g',{},gD);

        </div>
        <input id="scr" type="range" min="0" max="600" value="0" step="1"
          style="width:100%;height:5px;appearance:none;border-radius:3px;background-color:#22303C;outline:none;cursor:pointer">
      </div>
      <button id="lp" style="all:unset;cursor:pointer;padding:9px 14px;border-radius:8px;font:600 13px 'JetBrains Mono',monospace;
        letter-spacing:.08em;color:#E9EEF2;box-shadow:inset 0 0 0 1px #2C3B48">LOOP</button>
      <button id="mu" style="all:unset;cursor:pointer;padding:9px 14px;border-radius:8px;font:600 13px 'JetBrains Mono',monospace;
        letter-spacing:.08em;color:#E9EEF2;box-shadow:inset 0 0 0 1px #2C3B48">SOUND</button>`;
    document.body.appendChild(bar);
    const st=document.createElement('style');
    st.textContent=`#scr::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
      background:#FF5A36;box-shadow:0 0 0 3px #0E151C;cursor:pointer}
      #scr{background-image:linear-gradient(#FF5A36,#FF5A36);background-repeat:no-repeat;background-size:0% 100%}
`;
    document.head.appendChild(st);

    const $=id=>bar.querySelector('#'+id);
    const pp=$('pp'),ppi=$('ppi'),tt=$('tt'),cc=$('cc'),scr=$('scr'),lp=$('lp'),mu=$('mu');
    let t=clampT(Number(q.get('t')||0)),playing=false,loop=true,muted=false,last=performance.now();
    function clampT(v){return Math.max(0,Math.min(DUR-.001,Number(v)||0));}
    const fmt=v=>String(Math.floor(v/60)).padStart(2,'0')+':'+String(Math.floor(v%60)).padStart(2,'0')+'.'+Math.floor((v%1)*10);
    const chName=v=>{let k=0;for(let i=0;i<CHT.length;i++)if(v>=CHT[i])k=i;return CHN[k]||'';};

    function seek(v,{play=playing}={}){
      t=clampT(v);if(audioOK())A.currentTime=t;
      window.renderAt(t);ui();
      if(play&&!playing)start();
    }
    function start(){playing=true;ppi.setAttribute('d','M5 3h3v14H5zM12 3h3v14h-3z');
      if(audioOK()){if(Math.abs(A.currentTime-t)>.02)A.currentTime=t;A.play().catch(()=>{});}}
    function stop(){playing=false;ppi.setAttribute('d','M5 3l12 7-12 7z');A.pause();}
    function ui(){
      tt.textContent=fmt(t);cc.textContent=chName(t);
      scr.value=Math.round(t*10);
      scr.style.backgroundSize=(t/DUR*100).toFixed(2)+'% 100%';
    }
    function frame(now){
      const dt=Math.min(.12,(now-last)/1000);last=now;
      if(playing){
        if(audioOK()&&!A.paused&&A.currentTime>0)t=A.currentTime;
        else t+=dt;
        if(t>=DUR-.001){
          if(loop){t=0;if(audioOK())A.currentTime=0;A.play().catch(()=>{});}
          else {t=DUR-.001;stop();}
        }
        window.renderAt(t);ui();
      }
      requestAnimationFrame(frame);
    }
    pp.onclick=()=>playing?stop():start();
    document.getElementById('stage').addEventListener('click',()=>playing?stop():start());
    scr.oninput=()=>seek(scr.value/10);
    const paintLp=()=>{lp.style.background=loop?'#FF5A36':'transparent';
      lp.style.color=loop?'#0E151C':'#E9EEF2';lp.style.boxShadow=loop?'none':'inset 0 0 0 1px #2C3B48';};
    lp.onclick=()=>{loop=!loop;paintLp();};paintLp();
    mu.onclick=()=>{muted=!muted;A.muted=muted;mu.style.color=muted?'#8C9AA8':'#E9EEF2';
      mu.textContent=muted?'MUTED':'SOUND';};
    addEventListener('keydown',e=>{
      if(e.code==='Space'){e.preventDefault();playing?stop():start();}
      else if(e.code==='ArrowRight'){seek(t+(e.shiftKey?5:1));}
      else if(e.code==='ArrowLeft'){seek(t-(e.shiftKey?5:1));}
      else if(e.code==='KeyL'){lp.onclick();}
      else if(e.code==='Home'){seek(0);}
    });
    const hint=document.createElement('div');
    hint.style.cssText=`position:fixed;left:50%;top:22px;transform:translateX(-50%);padding:9px 18px;border-radius:999px;
      background:rgba(14,21,28,.86);color:#9AA8B5;font:500 13px Inter,sans-serif;letter-spacing:.02em;z-index:9999;
      transition:opacity .6s;pointer-events:none`;
    hint.textContent='空格 播放/暂停 · ← → 快退/快进 · 拖动进度条逐帧看';
    document.body.appendChild(hint);
    setTimeout(()=>{hint.style.opacity='0';},4200);

    window.renderAt(t);ui();
    requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
    A.addEventListener('error',()=>{mu.textContent='NO AUDIO';mu.style.color='#8C9AA8';});
  }
}
</script></body></html>
