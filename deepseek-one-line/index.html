<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>一条线 · DeepSeek 2023—2026</title>
<style>
  @font-face{font-family:'Archivo';src:url('assets/fonts/Archivo-w1000-500.ttf');font-weight:500}
  @font-face{font-family:'Archivo';src:url('assets/fonts/Archivo-w1000-700.ttf');font-weight:700}
  @font-face{font-family:'Archivo';src:url('assets/fonts/Archivo-w1000-900.ttf');font-weight:900}
  @font-face{font-family:'ArchivoN';src:url('assets/fonts/Archivo-w875-700.ttf');font-weight:700}
  @font-face{font-family:'ArchivoWide';src:url('assets/fonts/Archivo-w1125-900.ttf');font-weight:900}
  @font-face{font-family:'PlexMono';src:url('assets/fonts/IBMPlexMono-Light.ttf');font-weight:300}
  @font-face{font-family:'PlexMono';src:url('assets/fonts/IBMPlexMono-Regular.ttf');font-weight:400}
  @font-face{font-family:'PlexMono';src:url('assets/fonts/IBMPlexMono-Medium.ttf');font-weight:500}
  @font-face{font-family:'Corm';src:url('assets/fonts/CormorantItalic-400.ttf');font-style:italic}
  html,body{margin:0;background:#000;overflow:hidden}
  #c{display:block;width:2048px;height:858px}
</style></head>
<body><canvas id="c" width="2048" height="858"></canvas>
<script type="module">
/* ============================================================================
   一条线 · DeepSeek 2023—2026     60 s · 2.39:1 · 24 fps
   ---------------------------------------------------------------------------
   27 shots. One line runs through all of them and every chapter turns it into a
   different concrete object: a plotter stroke, a rack of channels, a price tag,
   a receipt, an oscilloscope trace, a woven cloth, an odometer, a corridor,
   and finally a single line again.

   Every pixel is a pure function of t. Nothing animates by itself.
   ========================================================================== */
const W = 2048, H = 858;
const INK = '#08090A', INK2 = '#151517', BONE = '#EFEAE1', GRAY = '#8A857C',
      SIGNAL = '#FF4D12', EMBER = '#FF8A3D', PAPER = '#E9E3D6', PAPER2 = '#F3EEE3';

const cv = document.getElementById('c');
const g = cv.getContext('2d', { alpha: false });
const CUES = await (await fetch('cues.json', { cache: 'no-store' })).json();
const E = CUES.ev;

/* ------------------------------ fonts ------------------------------ */
for (const [fam, file, wt, st] of [
  ['Archivo', 'Archivo-w1000-500.ttf', '500', ''], ['Archivo', 'Archivo-w1000-700.ttf', '700', ''],
  ['Archivo', 'Archivo-w1000-900.ttf', '900', ''], ['ArchivoN', 'Archivo-w875-700.ttf', '700', ''],
  ['ArchivoWide', 'Archivo-w1125-900.ttf', '900', ''], ['PlexMono', 'IBMPlexMono-Light.ttf', '300', ''],
  ['PlexMono', 'IBMPlexMono-Regular.ttf', '400', ''], ['PlexMono', 'IBMPlexMono-Medium.ttf', '500', ''],
  ['Corm', 'CormorantItalic-400.ttf', '400', 'italic'],
]) {
  const ff = new FontFace(fam, `url(assets/fonts/${file})`, { weight: wt, style: st || 'normal' });
  await ff.load(); document.fonts.add(ff);
}
await document.fonts.load('400 40px "Songti SC"').catch(() => {});
await document.fonts.load('500 40px "PingFang SC"').catch(() => {});
await document.fonts.ready;

/* ------------------------------ maths ------------------------------ */
const cl = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const P = (t, a, d) => cl((t - a) / d);
const oC = u => 1 - Math.pow(1 - u, 3);
const oQ = u => 1 - Math.pow(1 - u, 4);
const oX = u => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const iQ = u => u * u;
const iC = u => u * u * u;
const ioC = u => (u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const ioS = u => -(Math.cos(Math.PI * u) - 1) / 2;
const iEx = u => (u <= 0 ? 0 : Math.pow(2, 10 * u - 10));
const oB = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const spring = (u, s = 1.7) => (u <= 0 ? 0 : 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2));
const wave = (u, f, ph = 0) => Math.sin(u * f * Math.PI * 2 + ph);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ------------------------------ type ------------------------------ */
const FAM = { arch: 'Archivo', archN: 'ArchivoN', wide: 'ArchivoWide', mono: 'PlexMono', song: '"Songti SC"', sans: '"PingFang SC"', corm: 'Corm' };
function text(s, x, y, o = {}) {
  const { size = 24, family = 'mono', weight = 400, color = BONE, align = 'left',
    baseline = 'alphabetic', alpha = 1, sp = 0, rot = 0 } = o;
  if (alpha <= .004 || s === '' || s == null) return;
  g.save();
  g.globalAlpha = cl(alpha);
  g.fillStyle = color;
  g.textAlign = align; g.textBaseline = baseline;
  g.font = `${weight ? weight + ' ' : ''}${size}px ${FAM[family] || family}`;
  g.letterSpacing = `${sp}px`;
  if (rot) { g.translate(x, y); g.rotate(rot); g.fillText(s, 0, 0); }
  else g.fillText(s, x, y);
  g.restore();
}
function measure(s, o = {}) {
  g.save();
  g.font = `${o.weight ? o.weight + ' ' : ''}${o.size || 24}px ${FAM[o.family] || o.family || FAM.mono}`;
  g.letterSpacing = `${o.sp || 0}px`;
  const w = g.measureText(s).width; g.restore(); return w;
}
/* rises out of its own mask — used for lines that arrive with the beat */
function rise(s, x, y, o, prog) {
  if (prog <= .001) return;
  const size = o.size || 24, e = oX(cl(prog, 0, 1));
  g.save();
  g.beginPath(); g.rect(x - 3000, y - size * 3, 7000, size * 4); g.clip();
  text(s, x, y + (1 - e) * size * 1.15, { ...o, alpha: (o.alpha ?? 1) * cl(prog * 2.6) });
  g.restore();
}
/* scale-settles in on the hit */
function slam(s, x, y, o, prog, from = 1.14) {
  if (prog <= 0) return;
  const e = spring(cl(prog, 0, 1), 1.5), sc = lerp(from, 1, e);
  g.save(); g.translate(x, y); g.scale(sc, sc);
  text(s, 0, 0, { ...o, alpha: (o.alpha ?? 1) * cl(prog * 3.4) });
  g.restore();
}
/* types on, with a caret — receipts, forms, terminals */
function typeIn(s, x, y, o, prog) {
  if (prog <= 0) return;
  const n = Math.ceil(s.length * cl(prog, 0, 1));
  text(s.slice(0, n), x, y, { ...o, alpha: (o.alpha ?? 1) * cl(prog * 6) });
  if (prog < .999) {
    const w = measure(s.slice(0, n), o), blk = (o.size || 20) * .5;
    g.save(); g.globalAlpha = cl(prog * 6) * .85; g.fillStyle = o.color || BONE;
    g.fillRect(x + w + (o.size || 20) * .07, y - blk * .78, blk * .46, blk); g.restore();
  }
}
/* big numbers that count */
function counter(v, x, y, o, decimals = 0) {
  text(decimals ? v.toFixed(decimals) : fmt(v), x, y, o);
}

/* ------------------------------ primitives ------------------------------ */
function line(x1, y1, x2, y2, o = {}) {
  const { w = 1.4, color = BONE, alpha = 1, cap = 'butt', dash = null } = o;
  if (alpha <= .004) return;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = w; g.lineCap = cap;
  if (dash) g.setLineDash(dash);
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
}
function poly(pts, o = {}) {
  const { w = 1.6, color = BONE, alpha = 1, cap = 'round', join = 'round', dash = null, close = false } = o;
  if (alpha <= .004 || pts.length < 2) return;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = w; g.lineCap = cap; g.lineJoin = join;
  if (dash) g.setLineDash(dash);
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  if (close) g.closePath();
  g.stroke(); g.restore();
}
function fillPoly(pts, color, alpha = 1) {
  if (alpha <= .004 || pts.length < 3) return;
  g.save(); g.globalAlpha = alpha; g.fillStyle = color;
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath(); g.fill(); g.restore();
}
function box(x, y, w, h, color, alpha = 1) {
  if (alpha <= .004 || w === 0 || h === 0) return;
  g.save(); g.globalAlpha = alpha; g.fillStyle = color; g.fillRect(x, y, w, h); g.restore();
}
function dot(x, y, r, color = BONE, alpha = 1) {
  if (alpha <= .004) return;
  g.save(); g.globalAlpha = alpha; g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); g.restore();
}
function ring(x, y, r, o = {}) {
  const { w = 1.2, color = BONE, alpha = 1, dash = null, a0 = 0, a1 = 6.2832 } = o;
  if (alpha <= .004) return;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = w;
  if (dash) g.setLineDash(dash);
  g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); g.restore();
}
/* the spark: white core, orange halo, four flickering rays */
function spark(x, y, a = 1, s = 1, t = 0) {
  if (a <= .004) return;
  const fl = .86 + .14 * Math.sin(t * 91.7) * Math.sin(t * 57.3);
  const gr = g.createRadialGradient(x, y, 0, x, y, 42 * s);
  gr.addColorStop(0, 'rgba(255,250,242,1)');
  gr.addColorStop(.09, 'rgba(255,190,130,.98)');
  gr.addColorStop(.28, 'rgba(255,122,58,.52)');
  gr.addColorStop(1, 'rgba(255,74,24,0)');
  g.save(); g.globalAlpha = a * fl; g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, 42 * s, 0, 6.2832); g.fill(); g.restore();
  dot(x, y, 3.2 * s, SIGNAL, a);
  dot(x, y, 1.5 * s, '#FFF8EF', a);
  for (let i = 0; i < 4; i++) {
    const ang = i * 1.5708 + t * 2.4 + .4, r = (13 + 6 * ((Math.sin(t * 30 + i) + 1) / 2)) * s;
    line(x, y, x + Math.cos(ang) * r, y + Math.sin(ang) * r, { w: 1.1 * s, color: EMBER, alpha: a * .7 });
  }
}
/* diagonal hatching clipped to a rect — engraving / section walls */
function hatch(x, y, w, h, o = {}) {
  const { ang = -.72, gap = 7, color = BONE, alpha = .5, lw = 1.1, phase = 0 } = o;
  if (alpha <= .004) return;
  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = lw;
  const dx = Math.cos(ang), dy = Math.sin(ang), len = Math.abs(w) + Math.abs(h) + 80;
  const nx = -dy, ny = dx;
  const cx = x + w / 2, cy = y + h / 2, R = Math.hypot(w, h) / 2 + 20;
  const n = Math.ceil((2 * R) / gap);
  g.beginPath();
  for (let i = -n; i <= n; i++) {
    const ox = cx + nx * (i * gap + phase), oy = cy + ny * (i * gap + phase);
    g.moveTo(ox - dx * R, oy - dy * R); g.lineTo(ox + dx * R, oy + dy * R);
  }
  g.stroke(); g.restore();
}
/* dashed guide rectangle — the frame's own safe areas */
function guideRect(x, y, w, h, o = {}) {
  const { color = BONE, alpha = .5, w: lw = 1.2, dash = [9, 9] } = o;
  if (alpha <= .004) return;
  g.save(); g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = lw; g.setLineDash(dash);
  g.strokeRect(x, y, w, h); g.restore();
}
/* engineering dimension line with ticks and a centred label */
function dim(x1, y1, x2, y2, label, o = {}) {
  const { color = EMBER, alpha = .85, size = 13, vertical = false, off = 10 } = o;
  line(x1, y1, x2, y2, { w: 1, color, alpha });
  const t = 7;
  if (vertical) {
    line(x1 - t, y1, x1 + t, y1, { w: 1, color, alpha });
    line(x2 - t, y2, x2 + t, y2, { w: 1, color, alpha });
  } else {
    line(x1, y1 - t, x1, y1 + t, { w: 1, color, alpha });
    line(x2, y2 - t, x2, y2 + t, { w: 1, color, alpha });
  }
  if (!label) return;
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  const lw = measure(label, { size, family: 'mono', sp: 1.2 }) + 12;
  g.save(); g.globalAlpha = alpha;
  g.fillStyle = INK; g.fillRect(mx - lw / 2, my - size * .8, lw, size * 1.15);
  g.restore();
  text(label, mx, my + size * .1, { size, family: 'mono', sp: 1.2, color, alpha, align: 'center' });
}
/* crop marks, camera bookends */
function cropMarks(a = 1, inset = 64, len = 46) {
  if (a <= .004) return;
  const L = inset, R = W - inset, T = inset, B = H - inset;
  const c = { w: 1.6, color: BONE, alpha: a * .75 };
  for (const [x, y, sx, sy] of [[L, T, 1, 1], [R, T, -1, 1], [L, B, 1, -1], [R, B, -1, -1]]) {
    line(x, y, x + sx * len, y, c);
    line(x, y, x, y + sy * len, c);
  }
}
function offscreen(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const cx = c.getContext('2d'); fn(cx, w, h); return c;
}

/* ------------------------------ film grain ------------------------------ */
const NOISE = offscreen(200, 200, (cx) => {
  const im = cx.createImageData(200, 200), r = mulberry32(90210);
  for (let i = 0; i < 200 * 200; i++) {
    const v = 128 + (r() - .5) * 215;
    im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255;
  }
  cx.putImageData(im, 0, 0);
});
const NOISE_PAT = g.createPattern(NOISE, 'repeat');
const VIGNETTE = offscreen(W, H, (cx) => {
  const gr = cx.createRadialGradient(W * .5, H * .46, H * .2, W * .5, H * .5, W * .72);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.6, 'rgba(0,0,0,0.14)');
  gr.addColorStop(1, 'rgba(0,0,0,0.58)');
  cx.fillStyle = gr; cx.fillRect(0, 0, W, H);
});

/* ------------------------------ camera ------------------------------ */
/* keys: [lt, zoom, x, y, rotDeg?]  — every shot declares its own move */
function camAt(keys, lt) {
  let a = keys[0], b = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++)
    if (lt >= keys[i][0] && lt <= keys[i + 1][0]) { a = keys[i]; b = keys[i + 1]; break; }
  if (lt >= b[0]) { a = b; b = b; }
  const u = a === b ? 0 : ioC(cl((lt - a[0]) / (b[0] - a[0] || 1), 0, 1));
  return {
    z: Math.exp(lerp(Math.log(a[1]), Math.log(b[1]), u)),
    x: lerp(a[2] || 0, b[2] || 0, u),
    y: lerp(a[3] || 0, b[3] || 0, u),
    r: lerp(a[4] || 0, b[4] || 0, u) * Math.PI / 180,
  };
}
function shakeAt(t) {
  let s = 0;
  for (const [tt, amp, dec] of [[E.cliff + .04, 26, 6.2], [21.66, 12, 12], [18.1, 8, 9], [44.45, 7, 10]]) {
    const d = t - tt; if (d >= 0 && d < 1.2) s += amp * Math.exp(-d * dec);
  }
  return s;
}
function noiseAt(t, k) { return mulberry32(1000 + Math.round(t * 24) + k * 977)() - .5; }

/* ------------------------------ HUD ------------------------------ */
/* only the crop-mark frame and a hairline progress rail — no corner readouts */
function hud(t, a = 1, dark = false) {
  const col = dark ? INK : BONE;
  line(132, H - 40, 1916 - 120, H - 40, { w: 1, color: col, alpha: .1 * a });
  line(132, H - 40, 132 + (1916 - 132 - 120) * cl(t / 60), H - 40, { w: 1.4, color: SIGNAL, alpha: .55 * a });
}

/* ============================================================================
   01 · ORIGIN — the sheet and the pen
   ========================================================================== */
function Sheet(a = 1) {
  // the construction grid: bone hairlines, orange major ticks
  for (let x = 0; x < W; x += 46) line(x, 0, x, H, { w: .7, color: BONE, alpha: .062 * a });
  for (let y = 0; y < H; y += 46) line(0, y, W, y, { w: .7, color: BONE, alpha: .062 * a });
  for (let x = 0; x <= W; x += 230) {
    line(x, 0, x, H, { w: 1, color: BONE, alpha: .1 * a });
    line(x, 0, x, 10, { w: 1, color: SIGNAL, alpha: .5 * a });
    line(x, H - 10, x, H, { w: 1, color: SIGNAL, alpha: .5 * a });
  }
  for (let y = 0; y <= H; y += 230) {
    line(0, y, W, y, { w: 1, color: BONE, alpha: .1 * a });
    line(0, y, 10, y, { w: 1, color: SIGNAL, alpha: .5 * a });
    line(W - 10, y, W, y, { w: 1, color: SIGNAL, alpha: .5 * a });
  }
}
function s1a(t, lt) {
  const p = P(lt, 0, 1.55);
  box(0, 0, W, H, INK);
  Sheet(1);
  cropMarks(cl(P(lt, .05, .7)) * cl(1 - P(lt, 2.1, .3)) * .9, 64, 46);

  const y = 566;
  // the pen: a hairline being plotted left → right, with the head visible.
  // The opening frame is never empty: the sheet, the grid, and a short stroke already exist.
  const x = 150 + 1740 * oQ(.04 + .96 * p);
  line(150, y, x, y, { w: 2.6, color: BONE, alpha: .95 });
  line(150, y, x, y, { w: 6, color: SIGNAL, alpha: .12 });
  spark(x, y, 1, 1.05, t);

  // the TikZ-style listing, typed — the model's first definition
  const code = [
    'model DeepSeekV0 {',
    '  layers      = 61',
    '  hidden      = 7168',
    '  experts     = 1        // not yet',
    '  objective   = next_token',
    '}',
  ];
  const cA = P(lt, .35, 1.3);
  if (cA > 0) {
    text('fig. 01', 150, 132, { size: 11, family: 'mono', sp: 4, color: SIGNAL, alpha: .8 * cl(cA * 2) });
    for (let i = 0; i < code.length; i++) {
      const a = P(lt, .35 + i * .11, .3);
      text(code[i], 150, 170 + i * 27, { size: 15, family: 'mono', sp: .4, color: GRAY, alpha: .8 * a });
    }
  }
  // the sheet's title block, bottom left — a drawing, not a slide
  const tb = P(lt, .6, .8);
  if (tb > 0) {
    line(150, H - 150, 700, H - 150, { w: 1, color: BONE, alpha: .25 * tb });
    line(150, H - 96, 700, H - 96, { w: 1, color: BONE, alpha: .25 * tb });
    line(150, H - 150, 150, H - 96, { w: 1, color: BONE, alpha: .25 * tb });
    line(430, H - 150, 430, H - 96, { w: 1, color: BONE, alpha: .25 * tb });
    line(560, H - 150, 560, H - 96, { w: 1, color: BONE, alpha: .25 * tb });
    line(700, H - 150, 700, H - 96, { w: 1, color: BONE, alpha: .25 * tb });
    text('DRAWN BY', 160, H - 128, { size: 8, family: 'mono', sp: 2, color: GRAY, alpha: .8 * tb });
    text('a single line', 160, H - 110, { size: 12, family: 'mono', sp: .6, color: BONE, alpha: .75 * tb });
    text('DURATION', 440, H - 128, { size: 8, family: 'mono', sp: 2, color: GRAY, alpha: .8 * tb });
    text('60.0 s', 440, H - 110, { size: 12, family: 'mono', sp: .6, color: BONE, alpha: .75 * tb });
    text('SHEET', 570, H - 128, { size: 8, family: 'mono', sp: 2, color: GRAY, alpha: .8 * tb });
    text('01 / 08', 570, H - 110, { size: 12, family: 'mono', sp: .6, color: BONE, alpha: .75 * tb });
  }
  hud(t, cl(1 - P(lt, 1.8, .5)));
}
function s1b(t, lt) {
  box(0, 0, W, H, INK);
  Sheet(cl(1 - P(lt, 2.1, .5)) * .7);
  const y = 566;
  const a0 = cl(P(lt, 0, .5));
  // the datum is already there, the ends register
  line(150, y, 1898, y, { w: 2.6, color: BONE, alpha: .3 * a0 });
  const dr = oQ(P(lt, 0, .5));
  line(150, y, 150 + 1748 * dr, y, { w: 2.6, color: BONE, alpha: .98 });

  // compass arcs ignite out of the left origin, one per beat
  for (let i = 0; i < 3; i++) {
    const sw = oC(P(lt, .05 + i * .13, 1.4));
    const R = [420, 610, 780][i];
    ring(150, y, R, { w: i === 0 ? 2.2 : 1, color: i === 0 ? SIGNAL : EMBER, alpha: (i === 0 ? .9 : .42) * sw, a0: -Math.PI * .54, a1: -Math.PI * .54 + Math.PI * 1.06 * sw });
  }
  // the radius, drawn and dimensioned
  const rr = 610 * oC(P(lt, .25, 1.1));
  const ra = -Math.PI * .17;
  poly([[150, y], [150 + rr * Math.cos(ra), y + rr * Math.sin(ra)]], { w: 1, color: SIGNAL, alpha: .5 * cl(P(lt, .3, .4)) });
  dim(150 + rr * Math.cos(ra) + 20, y + rr * Math.sin(ra) + 20, 150 + rr * Math.cos(ra) + 90, y + rr * Math.sin(ra) + 90, '', { alpha: .35 });

  // the date, plotted on the line
  const dIn = P(lt, .12, .62);
  slam('2023.07.17', 146, y - 74, { size: 182, family: 'arch', weight: 900, sp: -8, color: BONE, alpha: .97 }, dIn, 1.08);

  // registration ticks
  const tk = oC(P(lt, .5, .9));
  for (let i = 0; i <= 20; i++) {

  // never on an empty frame. Advance the local clock so entry eases have already started.
  const ls = lt + .12;

  g.scale(c.z, c.z);

  const fade = Math.max(1 - cl(P(t, 0, .4)), cl(P(t, 59.2, .75)));
  if (fade > .001) { g.fillStyle = `rgba(3,3,4,${fade})`; g.fillRect(0, 0, W, H); }
  if (t >= 59.97) { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); }
}

window.DEMO = { width: W, height: H, fps: 24, duration: 60, motionBlur: { samples: 4, shutter: 0.5 } };
window.renderAt = (t) => { draw(cl(t, 0, 59.999)); return true; };
draw(0);
window.__ready = true;
</script>
